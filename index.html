<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Water">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <title>Water</title>
  <link rel="stylesheet" href="ui/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="start" class="start">
      <div class="start-inner">
        <div class="start-drop"></div>
        <div class="start-label">Tap to play</div>
        <div class="start-sub"></div>
      </div>
      <div class="start-alt">
        <button id="start-free" class="link-btn" type="button">Free water</button>
        <button id="start-bg" class="link-btn" type="button">Background</button>
      </div>
    </div>
    <div id="hud" class="hud" hidden>
      <div class="hud-bar">
        <button id="hud-menu" class="icon-btn" type="button" aria-label="Levels">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
        </button>
        <div class="hud-title"><span class="hud-num" id="hud-level">1</span><span id="hud-name"></span></div>
        <button id="hud-bg" class="icon-btn" type="button" aria-label="Background">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/></svg>
        </button>
      </div>
      <div class="hud-meter" role="progressbar" aria-label="Water in the cup"><div class="hud-fill" id="hud-fill"></div><div class="hud-target" id="hud-target"></div></div>
      <div class="hud-hint" id="hud-hint"></div>
    </div>
    <div id="win" class="card-wrap" hidden>
      <div class="card">
        <div class="win-stars" id="win-stars"></div>
        <div class="card-title" id="win-title"></div>
        <div class="card-sub" id="win-time"></div>
        <div class="card-actions">
          <button id="win-replay" class="btn" type="button">Replay</button>
          <button id="win-next" class="btn btn-main" type="button">Next level</button>
        </div>
      </div>
    </div>
    <div id="levels" class="card-wrap" hidden>
      <div class="card">
        <div class="card-title">Levels</div>
        <div class="lvl-list" id="levels-body"></div>
        <div class="card-actions">
          <button id="free-mode" class="btn" type="button">Free water</button>
          <button id="levels-close" class="btn btn-main" type="button">Close</button>
        </div>
      </div>
    </div>
    <div id="bgsheet" class="card-wrap" hidden>
      <div class="card">
        <div class="card-title">Background</div>
        <div class="card-sub">Seen through the water, bent by it.</div>
        <div class="bg-options"></div>
        <input id="bg-file" type="file" accept="image/*" hidden>
        <div class="bg-status" aria-live="polite"></div>
        <div class="card-actions"><button class="btn btn-main bg-close" type="button">Done</button></div>
      </div>
    </div>
    <button id="free-exit" class="icon-btn free-exit" type="button" aria-label="Levels and background" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
    </button>
    <div id="hint" class="hint" hidden>Drag to tilt · flick to shake · tap to splash</div>
    <div id="debug" class="debug" hidden></div>
    <div id="fatal" class="fatal" hidden></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
